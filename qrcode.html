<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Kejutan - Anisa Aulia 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(ellipse at 50% 100%, #1b1035 0%, #0c0a24 45%, #050511 100%);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .qr-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 2.2rem 2rem;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.55), 0 0 40px rgba(255, 68, 134, 0.2);
    }

    .qr-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.4rem;
      color: #ffacc5;
      margin-bottom: 0.35rem;
    }

    .qr-subtitle {
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 1.5rem;
    }

    .qr-box {
      background: #ffffff;
      padding: 1rem;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      margin-bottom: 1.25rem;
    }

    .qr-box img {
      width: 240px;
      height: 240px;
      display: block;
    }

    .qr-url {
      display: block;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.6);
      word-break: break-all;
      margin-bottom: 1.4rem;
      text-decoration: none;
    }

    .qr-url:hover {
      color: #ffacc5;
    }

    .actions {
      display: flex;
      gap: 0.65rem;
      justify-content: center;
    }

    .btn {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: linear-gradient(135deg, #ff2a6d 0%, #ff5c8a 100%);
      color: #fff;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: filter 0.2s, transform 0.15s;
    }

    .btn:hover {
      filter: brightness(1.1);
    }

    .btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="qr-card">
    <h1 class="qr-title">Scan Me 🌸</h1>
    <p class="qr-subtitle">Arahkan kamera HP untuk membuka kejutan</p>

    <div class="qr-box">
      <img src="qrcode.png" alt="QR Code https://danizulkifli.github.io/flower/" />
    </div>

    <a class="qr-url" href="https://danizulkifli.github.io/flower/" target="_blank" rel="noopener">
      https://danizulkifli.github.io/flower/
    </a>

    <div class="actions">
      <a class="btn" href="qrcode.png" download="qrcode-anisa-aulia.png">Unduh QR Code (PNG)</a>
    </div>
  </div>
</body>
</html>
